<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="referrer" content="no-referrer"/><title>Scholyx - Thiết lập mật khẩu</title><style>body{font-family:system-ui;background:#10172c;color:#fff;display:grid;place-items:center;min-height:95vh}main{background:#192442;border-radius:16px;padding:28px;width:min(90vw,430px)}label{display:block;margin:12px 0}input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px}button{width:100%;padding:12px;border:0;border-radius:8px;background:#6763e8;color:white;cursor:pointer}a{color:#a5b4fc}#msg{white-space:pre-wrap}</style></head><body><main><h2>Scholyx — Thiết lập mật khẩu</h2><p>Liên kết sử dụng một lần, hiệu lực 30 phút.</p><form id="form"><label>Mật khẩu mới (ít nhất 8 ký tự)<input id="password" type="password" minlength="8" maxlength="1024" autocomplete="new-password" required/></label><label>Xác nhận mật khẩu<input id="confirm" type="password" minlength="8" autocomplete="new-password" required/></label><div id="accept"><label><input style="width:auto" id="terms" type="checkbox"/> Tôi đồng ý Điều khoản sử dụng</label><label><input style="width:auto" id="privacy" type="checkbox"/> Tôi đồng ý Chính sách quyền riêng tư</label></div><button type="submit">Đặt mật khẩu</button></form><p id="msg" role="status"></p><a href="/">Về trang đăng nhập</a></main><script>
const params=new URLSearchParams(location.hash.slice(1));
const token=params.get('token')||'',purpose=params.get('purpose')||'';
document.getElementById('accept').hidden=purpose!=='invite';
history.replaceState(null,'',location.pathname);
const form=document.getElementById('form'),msg=document.getElementById('msg');
if(!/^[0-9a-f]{64}$/.test(token)||!['invite','reset'].includes(purpose)){msg.textContent='Liên kết không hợp lệ.';form.hidden=true;}
form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value;
if(password!==document.getElementById('confirm').value){msg.textContent='Mật khẩu xác nhận không khớp.';return;}
const button=form.querySelector('button');button.disabled=true;msg.textContent='Đang xử lý...';
try{const r=await fetch((['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='3000'?'http://'+location.hostname+':4000':'')+'/api/auth/admin-password-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,purpose,password,agreeTerms:document.getElementById('terms').checked,agreePrivacy:document.getElementById('privacy').checked})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Liên kết không hợp lệ hoặc hết hạn');msg.textContent=data.message;form.hidden=true;}catch(err){msg.textContent=err.message;button.disabled=false;}});
</script></body></html>
